name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Full Verification Gate (Typecheck, Biome Lint, Corpus Linter, Unit/Integration Tests, AFCA Evals)
        run: npm run verify

      - name: Run Python Quality Gate (Ruff & ty)
        run: npm run lint:py

      - name: Verify Corpus R2 Synchronization Keys
        run: npm run upload:r2

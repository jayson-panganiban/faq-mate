[project]
name = "faq-mate-collector"
version = "0.1.0"
description = "Raw corpus collector and extraction tooling for FAQ-Mate"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "requests>=2.31.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["scripts/collector"]
extend-exclude = [
    ".venv",
    "node_modules",
    "dist",
    ".wrangler",
    "data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length handled by ruff format
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.11"
root = ["scripts/collector"]

[tool.ty.src]
include = ["scripts/collector/**/*.py"]
exclude = [
    ".venv/**",
    "data/**",
]

[tool.ty.rules]
invalid-method-override = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
invalid-argument-type = "ignore"
redundant-condition = "ignore"
